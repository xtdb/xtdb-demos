services:
  xtdb:
    image: ghcr.io/xtdb/xtdb:2.2.0-rc0
    container_name: bikeshare-xtdb
    ports:
      # Exposed so the seed script can reach XTDB from the host. Deliberately not
      # 5432: anything else already bound there (a local Postgres, another XTDB, a
      # dev REPL) wins the host port silently on macOS, and then seed.py writes to
      # that node while Grafana — which reaches XTDB over the compose network —
      # queries an empty one. verify.py cross-checks the two to catch it anyway.
      - "5442:5432"
    volumes:
      - xtdb-data:/var/lib/xtdb
    # The image's own healthcheck uses `wget --spider`, which sends HEAD, and
    # /healthz/alive answers 405 — so it can never pass and every container
    # reports unhealthy forever (xtdb/xtdb, as of 2.2.0-rc0). Override with a GET.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz/alive"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  grafana:
    image: grafana/grafana:12.2
    container_name: bikeshare-grafana
    ports:
      - "3002:3000"
    depends_on:
      xtdb:
        # The XTDB image ships its own healthcheck against /healthz/alive,
        # so Grafana only starts once pgwire is actually accepting connections.
        condition: service_healthy
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # Skip the login screen — this is a throwaway local demo.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./grafana/dashboards:/var/lib/grafana/dashboards

volumes:
  xtdb-data:
