apiVersion: 1

datasources:
  # Grafana's stock PostgreSQL data source, pointed at XTDB's pgwire server.
  # No plugin, no fork — XTDB speaks enough of the Postgres catalog surface
  # for the visual query builder to introspect it.
  - name: XTDB
    type: postgres
    access: proxy
    # Container-to-container on the compose network; the host port mapping is
    # only there for the seed script.
    url: xtdb:5432
    user: xtdb
    isDefault: true
    uid: DS_XTDB
    jsonData:
      database: xtdb
      sslmode: disable
      # XTDB advertises itself as PG 16.
      postgresVersion: 1600
      timescaledb: false
