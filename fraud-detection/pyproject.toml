[project]
name = "xtdb-feature-store"
version = "0.1.0"
description = "XTDB as a feature store: point-in-time-correct feature retrieval in plain SQL"
requires-python = ">=3.12"
dependencies = [
    "adbc-driver-flightsql>=1.3",
    "fastapi>=0.110",
    "joblib>=1.3",
    "numpy>=1.24",
    "pandas>=2.0",
    "psycopg[binary]>=3.1",
    "pyarrow>=17.0",
    "scikit-learn>=1.3",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
# explain_auc.py plots feature separation; not needed to run the demo
analysis = ["matplotlib>=3.7"]

[tool.uv]
package = false
