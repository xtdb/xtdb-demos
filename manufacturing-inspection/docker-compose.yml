name: xtdb-manufacturing-inspection
services:
  xtdb:
    image: ghcr.io/xtdb/xtdb:2.2.0-rc0
    environment:
      JDK_JAVA_OPTIONS: -Xmx1g -XX:MaxDirectMemorySize=1g
    ports:
      - "127.0.0.1:${XTDB_PORT:-5456}:5432"
    volumes:
      - inspection-data:/var/lib/xtdb
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz/alive"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s
  app:
    build: .
    environment:
      XTDB_DSN: postgresql://xtdb@xtdb:5432/xtdb
    ports:
      - "127.0.0.1:${APP_PORT:-5180}:8000"
    depends_on:
      xtdb:
        condition: service_healthy
  playground:
    profiles: [test]
    image: ghcr.io/xtdb/xtdb:2.2.0-rc0
    command: [playground, --port, "5432"]
    environment:
      JDK_JAVA_OPTIONS: -Xmx1g -XX:MaxDirectMemorySize=1g
    ports:
      - "127.0.0.1:${TEST_PORT:-5457}:5432"
    healthcheck:
      disable: true
volumes:
  inspection-data:
