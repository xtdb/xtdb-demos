[project]
name = "manufacturing-inspection-live"
version = "0.1.0"
description = "A live production line and guided quality investigation with XTDB"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "psycopg[binary]>=3.2,<4", "uvicorn>=0.34,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
